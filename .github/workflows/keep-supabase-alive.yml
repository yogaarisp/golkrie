name: Keep Supabase Alive

on:
  schedule:
    # Jalan setiap 3 hari sekali (lebih dari cukup, Supabase pause setelah 7 hari)
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Bisa juga dijalankan manual dari GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/"
          echo " - Supabase pinged at $(date)"
